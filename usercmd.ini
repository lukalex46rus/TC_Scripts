button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\Rename-Mp3WithRandomPrefix.vbs
param=%P /Recurse /WhatIf
path=C:\Windows\System32\
menu=MP3: случайный префикс (предпросмотр)

; --- 8.5. Свой диапазон чисел ---
