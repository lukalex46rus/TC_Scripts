;===============================================================================
; usercmd.ini — Total Commander, пользовательские команды
; Версия:      4.0
; Скрипты:     %COMMANDER_PATH%\PROFILE\SCR\
; Логи:        %COMMANDER_PATH%\PROFILE\LOG\
; Temp:        %COMMANDER_PATH%\PROFILE\TMP\
; Notepad++:   %COMMANDER_PATH%\PROFILE\APP\Notepad++\notepad++.exe
;
; Соглашения:
;   - Все вызовы через wscript.exe (интерактив/MsgBox).
;   - Ключ /NoLog — отключить запись лога (по умолчанию лог включён).
;   - Параметры TC: %P — активная панель, %T — неактивная,
;                   %N — имя под курсором, %L — список выделенного.
;===============================================================================


;===============================================================================
; 1. MoveUp.vbs — поднять на уровень выше
;    Объединяет: 1FloorUp.vbs + MoveUp.vbs
;===============================================================================

; --- 1.1. Один объект под курсором ---
[em_MoveUp]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveUp.vbs
param=%P%N
path=C:\Windows\System32\
menu=Поднять на уровень выше (текущий)
; Пример: cscript //nologo MoveUp.vbs "%P%N"

; --- 1.2. Все выделенные + переход в целевую папку ---
[em_MoveUpList]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveUp.vbs
param=%L /Jump
path=C:\Windows\System32\
menu=Поднять выделенные на уровень выше + перейти

; --- 1.3. Все выделенные без перехода ---
[em_MoveUpListNoJump]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveUp.vbs
param=%L /Quiet
path=C:\Windows\System32\
menu=Поднять выделенные на уровень выше (тихо)

; --- 1.4. Один объект, без диалогов (для горячей клавиши) ---
[em_MoveUpQuiet]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveUp.vbs
param=%P%N /Quiet
path=C:\Windows\System32\
menu=Поднять на уровень выше (тихо)


;===============================================================================
; 2. NamesToClip.vbs — имена в буфер обмена
;    Объединяет: CopyNameWithoutEXT + CopyNамеAdd + CopyNамеNew
;===============================================================================

; --- 2.1. Полные пути как есть ---
[em_NamesToClip]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\NamesToClip.vbs
param=%L
path=C:\Windows\System32\
menu=Имена в буфер (полные пути)

; --- 2.2. Только имена файлов без расширений ---
[em_NamesToClipNoExt]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\NamesToClip.vbs
param=%L /NoExt /NameOnly
path=C:\Windows\System32\
menu=Имена в буфер (без расширений)

; --- 2.3. Полные пути без расширений ---
[em_NamesToClipNoExtPath]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\NamesToClip.vbs
param=%L /NoExt
path=C:\Windows\System32\
menu=Пути в буфер (без расширений)

; --- 2.4. С кавычками (для путей с пробелами/&) ---
[em_NamesToClipQuote]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\NamesToClip.vbs
param=%L /Quote
path=C:\Windows\System32\
menu=Имена в буфер (в кавычках)

; --- 2.5. В буфер + открыть Notepad++ на результате ---
[em_NamesToClipNpp]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\NamesToClip.vbs
param=%L /NoExt /NameOnly /Npp
path=C:\Windows\System32\
menu=Имена в буфер + Notepad++

; --- 2.6. В кавычках + Notepad++ ---
[em_NamesToClipQuoteNpp]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\NamesToClip.vbs
param=%L /Quote /Npp
path=C:\Windows\System32\
menu=Имена в кавычках + Notepad++


;===============================================================================
; 3. FileToOwnFolder.vbs — файл в папку с его именем
;    Объединяет: MoveFiles2NewFolderWithTheNameFile + MoveToNameFileFolder
;===============================================================================

; --- 3.1. Один файл под курсором → папка рядом ---
[em_FileToOwnFolder]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileToOwnFolder.vbs
param=%P%N
path=C:\Windows\System32\
menu=Файл в папку с его именем (текущий)

; --- 3.2. Все выделенные → каждый в свою папку рядом ---
[em_FileToOwnFolderList]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileToOwnFolder.vbs
param=%L
path=C:\Windows\System32\
menu=Выделенные в папки с их именами

; --- 3.3. Все выделенные → папки на неактивной панели ---
