button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileToOwnFolder.vbs
param=%P%N %T
path=C:\Windows\System32\
menu=Файл в папку на другой панели


;===============================================================================
; 4. MoveFiles2NewFolders.vbs — переместить в новую/указанную папку
;    Использует FSO (без Shell.Application)
;===============================================================================

; --- 4.1. Спросить имя папки (на активной панели) ---
[em_MoveFiles2NewFolders]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveFiles2NewFolders.vbs
param=%L %P
path=C:\Windows\System32\
menu=Переместить в новую папку (спросить имя)

; --- 4.2. Спросить имя папки на неактивной панели + перейти ---
[em_MoveFiles2NewFoldersTarget]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveFiles2NewFolders.vbs
param=%L %T /Jump
path=C:\Windows\System32\
menu=Переместить в новую папку на другой панели + перейти

; --- 4.3. Заданное имя «Archive» на активной панели ---
[em_MoveFiles2Archive]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveFiles2NewFolders.vbs
param=%L %P "Archive"
path=C:\Windows\System32\
menu=Переместить в папку Archive

; --- 4.4. Заданное имя «Archive» на неактивной + перейти ---
[em_MoveFiles2ArchiveTarget]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\MoveFiles2NewFolders.vbs
param=%L %T "Archive" /Jump
path=C:\Windows\System32\
menu=Переместить в Archive на другой панели + перейти


;===============================================================================
; 5. FileList.vbs — сформировать список файлов
;===============================================================================

; --- 5.1. Папка под курсором → list.txt в ней же (рекурсивно, относительно) ---
[em_FileListFolderRec]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileList.vbs
param=%P%N "%P\list.txt" /Recurse /Relative
path=C:\Windows\System32\
menu=Список файлов папки (рекурсивно, относительно)

; --- 5.2. Папка под курсором → list.txt (без рекурсии, полные пути) ---
[em_FileListFolderPlain]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileList.vbs
param=%P%N "%P\list.txt"
path=C:\Windows\System32\
menu=Список файлов папки (полные пути)

; --- 5.3. Выделенные (%L) → list.txt на неактивной панели (абсолютные) ---
[em_FileListFromSelToTarget]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileList.vbs
param=%L "%T\list.txt"
path=C:\Windows\System32\
menu=Выделенные → список на другой панели

; --- 5.4. Выделенные → новый файл с суффиксом, если занято ---
[em_FileListFromSelNew]
button=C:\Windows\System32\WScript.exe,2
cmd=%COMMANDER_PATH%\PROFILE\SCR\FileList.vbs
param=%L "%P\list.txt" /New
path=C:\Windows\System32\
menu=Выделенные → список (новый файл при коллизии)


